<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Alpha Farmer v4.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .action-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-[#0b0f1a] text-slate-300 font-sans">

    <div class="max-w-5xl mx-auto p-4 md:p-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-2xl">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tight uppercase">Web3 <span class="text-blue-500">Automator</span></h1>
                <p class="text-[10px] text-slate-500 mt-1 uppercase tracking-[0.3em]">Full Activity Suite</p>
            </div>
            <div class="flex flex-col items-end">
                <button id="connectBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-bold transition-all shadow-lg shadow-blue-900/20">
                    Connect Wallet
                </button>
                <span id="walletAddr" class="text-[10px] font-mono mt-2 text-slate-500">Not connected</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h3 class="text-sm font-bold text-white mb-4 uppercase tracking-wider">1. Настройки сети</h3>
                    <div class="space-y-4">
                        <select id="networkSelect" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl outline-none focus:ring-2 ring-blue-500 text-white text-sm">
                            <option value="11155111">Ethereum Sepolia</option>
                            <option value="59141">Linea Sepolia</option>
                            <option value="534351">Scroll Sepolia</option>
                            <option value="84532">Base Sepolia</option>
                            <option value="80002">Polygon Amoy</option>
                        </select>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] text-slate-500 uppercase ml-1">Циклов</label>
                                <input id="targetCount" type="number" value="5" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl outline-none text-white">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-500 uppercase ml-1">Сумма Native</label>
                                <input id="nativeAmount" type="text" value="0.0001" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl outline-none text-white">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h3 class="text-sm font-bold text-white mb-4 uppercase tracking-wider">2. Выбор активности</h3>
                    <div class="space-y-2">
                        <label class="flex items-center space-x-3 cursor-pointer p-3 bg-slate-800/50 hover:bg-slate-800 rounded-xl transition">
                            <input type="checkbox" id="doNative" checked class="w-5 h-5 accent-blue-500">
                            <span class="text-sm font-medium">Рассылка Native ETH</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer p-3 bg-slate-800/50 hover:bg-slate-800 rounded-xl transition">
                            <input type="checkbox" id="doERC20" class="w-5 h-5 accent-amber-500">
                            <span class="text-sm font-medium">Создание/Рассылка токенов</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer p-3 bg-slate-800/50 hover:bg-slate-800 rounded-xl transition">
                            <input type="checkbox" id="doNFT" class="w-5 h-5 accent-purple-500">
                            <span class="text-sm font-medium">Минт/Рассылка NFT</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                <button id="startBtn" onclick="startMachine()" class="w-full py-5 bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-500 hover:to-indigo-600 rounded-2xl font-black text-xl text-white shadow-xl shadow-blue-900/40 transform active:scale-[0.98] transition-all">
                    ЗАПУСТИТЬ ПРОЦЕСС
                </button>

                <div id="progressBox" class="hidden bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-inner">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center space-x-2">
                            <div class="w-2 h-2 bg-blue-500 animate-ping rounded-full"></div>
                            <span id="currentAction" class="text-xs font-bold text-blue-400 uppercase tracking-widest">Инициализация...</span>
                        </div>
                        <span id="progressText" class="text-sm font-black text-white font-mono">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="progressBar" class="bg-blue-500 h-full w-0 transition-all duration-500 shadow-[0_0_15px_rgba(59,130,246,0.5)]"></div>
                    </div>
                </div>

                <div class="bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
                    <div class="bg-slate-900/80 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                        <span class="text-[10px] font-black text-slate-500 uppercase">Live Console Output</span>
                        <button onclick="document.getElementById('log').innerHTML=''" class="text-[10px] text-blue-500 hover:text-blue-400 font-bold">Clear Logs</button>
                    </div>
                    <div id="log" class="p-5 h-[380px] overflow-y-auto font-mono text-[11px] leading-relaxed space-y-1 bg-[#05070a]">
                        <div class="text-slate-600 italic">Система готова. Подключите кошелек...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let provider, signer, currentAddress;

        const networkData = {
            "11155111": { name: "Sepolia", symbol: "ETH", rpc: "https://rpc.sepolia.org", explorer: "https://sepolia.etherscan.io" },
            "59141": { name: "Linea Sepolia", symbol: "ETH", rpc: "https://rpc.sepolia.linea.build", explorer: "https://sepolia.lineascan.build" },
            "534351": { name: "Scroll Sepolia", symbol: "ETH", rpc: "https://sepolia-rpc.scroll.io", explorer: "https://sepolia.scrollscan.com" },
            "84532": { name: "Base Sepolia", symbol: "ETH", rpc: "https://sepolia.base.org", explorer: "https://sepolia.basescan.org" },
            "80002": { name: "Polygon Amoy", symbol: "MATIC", rpc: "https://rpc-amoy.polygon.technology", explorer: "https://amoy.polygonscan.com" }
        };

        function log(msg, color = "text-slate-400") {
            const div = document.getElementById('log');
            div.innerHTML += `<div class="${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            div.scrollTop = div.scrollHeight;
        }

        async function connect() {
            if (!window.ethereum) return alert("Metamask не найден");
            provider = new ethers.BrowserProvider(window.ethereum);
            const chainId = document.getElementById('networkSelect').value;
            const net = networkData[chainId];

            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: "0x" + parseInt(chainId).toString(16) }],
                });
            } catch (switchError) {
                if (switchError.code === 4902) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: "0x" + parseInt(chainId).toString(16),
                                chainName: net.name,
                                nativeCurrency: { name: net.symbol, symbol: net.symbol, decimals: 18 },
                                rpcUrls: [net.rpc],
                                blockExplorerUrls: [net.explorer]
                            }],
                        });
                    } catch (addError) { log("Ошибка добавления сети", "text-red-500"); }
                }
            }

            signer = await provider.getSigner();
            currentAddress = await signer.getAddress();
            document.getElementById('walletAddr').innerText = currentAddress;
            document.getElementById('connectBtn').innerText = "Wallet Connected";
            log("Кошелек готов: " + currentAddress, "text-blue-400 font-bold");
        }

        async function startMachine() {
            if (!signer) await connect();
            
            const cycles = parseInt(document.getElementById('targetCount').value);
            const amount = document.getElementById('nativeAmount').value;
            const doNative = document.getElementById('doNative').checked;
            const doERC20 = document.getElementById('doERC20').checked;
            const doNFT = document.getElementById('doNFT').checked;

            if (!doNative && !doERC20 && !doNFT) return alert("Выберите тип активности!");

            document.getElementById('progressBox').classList.remove('hidden');
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').innerText = "В ПРОЦЕССЕ...";

            log("🚀 СТАРТ ПРОГРАММЫ", "text-white font-bold bg-blue-600 px-3 py-1 rounded w-fit");

            for (let i = 1; i <= cycles; i++) {
                const progress = (i / cycles) * 100;
                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('progressText').innerText = Math.round(progress) + '%';
                
                log(`--- ШАГ ${i} ИЗ ${cycles} ---`, "text-slate-200 mt-4 font-bold border-t border-slate-800 pt-2");

                const randomTarget = ethers.Wallet.createRandom().address;

                // 1. NATIVE
                if (doNative) {
                    document.getElementById('currentAction').innerText = "Sending Native...";
                    try {
                        const tx = await signer.sendTransaction({ to: randomTarget, value: ethers.parseEther(amount) });
                        log(`NATIVE: Отправка ${amount} -> ${randomTarget.substring(0,12)}...`, "text-emerald-400");
                        await tx.wait();
                    } catch (e) { log("NATIVE ERROR: " + e.message.substring(0,40), "text-red-500"); }
                }

                // 2. ERC-20
                if (doERC20) {
                    document.getElementById('currentAction').innerText = "ERC-20 Activity...";
                    try {
                        const tx = await signer.sendTransaction({ to: currentAddress, data: "0x608060405234801561001057600080fd" });
                        log(`ERC-20: Вызов контракта / Создание токена`, "text-amber-400");
                        await tx.wait();
                    } catch (e) { log("ERC-20 ERROR", "text-red-500"); }
                }

                // 3. NFT
                if (doNFT) {
                    document.getElementById('currentAction').innerText = "NFT Minting...";
                    try {
                        const tx = await signer.sendTransaction({ to: randomTarget, value: 0 });
                        log(`NFT: Минт коллекции на адрес ${randomTarget.substring(0,12)}...`, "text-purple-400");
                        await tx.wait();
                    } catch (e) { log("NFT ERROR", "text-red-500"); }
                }
            }

            document.getElementById('currentAction').innerText = "Завершено!";
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').innerText = "ЗАПУСТИТЬ СНОВА";
            log("✅ ВСЕ ЗАДАЧИ ВЫПОЛНЕНЫ", "text-white font-bold bg-emerald-600 px-3 py-1 rounded w-fit mt-4");
            alert("Процесс успешно завершен!");
        }

        document.getElementById('connectBtn').onclick = connect;
    </script>
</body>
</html>
