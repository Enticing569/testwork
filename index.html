<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Alpha Farmer v31.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#020408] text-slate-300 font-sans">

    <header class="sticky top-0 z-50 bg-[#020408]/90 backdrop-blur-md border-b border-slate-800 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black text-white uppercase italic tracking-tighter text-blue-500">Alpha <span class="text-white">Farmer</span> v31</h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <span id="netIndicator" class="w-2 h-2 rounded-full bg-slate-600"></span>
                    <p id="walletAddr" class="text-[9px] text-slate-500 font-mono">Wallet not connected</p>
                </div>
            </div>
            <button id="connectBtn" onclick="connect()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-1.5 rounded-xl font-bold text-xs transition-all shadow-lg shadow-blue-500/20">
                Connect Wallet
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8 space-y-6">
        <div class="grid grid-cols-4 gap-4">
            <div class="bg-slate-900/40 p-3 rounded-xl border border-slate-800 text-center"><p class="text-[9px] text-slate-500 uppercase font-bold">Total</p><p id="statTotal" class="text-lg font-black text-white">0</p></div>
            <div class="bg-slate-900/40 p-3 rounded-xl border border-slate-800 text-center"><p class="text-[9px] text-emerald-500 uppercase font-bold">Success</p><p id="statSuccess" class="text-lg font-black text-emerald-400">0</p></div>
            <div class="bg-slate-900/40 p-3 rounded-xl border border-slate-800 text-center"><p class="text-[9px] text-red-500 uppercase font-bold">Failed</p><p id="statFailed" class="text-lg font-black text-red-400">0</p></div>
            <div class="bg-slate-900/40 p-3 rounded-xl border border-slate-800 text-center"><p class="text-[9px] text-blue-500 uppercase font-bold">Dust</p><p id="statDust" class="text-lg font-black text-blue-400">0</p></div>
        </div>

        <div class="grid grid-cols-12 gap-6">
            <div class="col-span-4 space-y-4">
                <div id="moduleList" class="bg-slate-900/40 p-6 rounded-2xl border border-slate-800">
                    </div>
                <div class="bg-slate-900/40 p-4 rounded-2xl border border-slate-800">
                    <label class="text-[9px] text-slate-500 uppercase font-bold">Cycles</label>
                    <input id="txCount" type="number" value="1" class="w-full bg-slate-950 border border-slate-700 p-2 rounded-lg text-white text-xs mt-1">
                </div>
            </div>

            <div class="col-span-8 space-y-4">
                <button id="startBtn" onclick="startMachine()" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:brightness-110 text-white rounded-2xl font-black uppercase tracking-widest shadow-xl">
                    Run Sequence
                </button>
                <div id="log" class="bg-black p-4 h-[400px] rounded-2xl overflow-y-auto font-mono text-[10px] border border-slate-800 text-slate-400">
                    > System ready.
                </div>
            </div>
        </div>
    </main>

    <script>
        let provider, signer, myAddr, latestTokenAddress;
        let stats = { total: 0, success: 0, failed: 0, dust: 0 };

        const modules = [
            { id: 'doNative', name: 'Native Transfer (Dust)', color: 'blue', type: 'action' },
            { id: 'doGM', name: 'GM On-Chain Data', color: 'indigo', type: 'action' },
            { id: 'doERC20', name: 'Deploy ERC-20', color: 'amber', type: 'deploy' },
            { id: 'doNFT', name: 'Deploy ERC-721', color: 'purple', type: 'deploy' },
            { id: 'doTransfer', name: 'Distribute Tokens/NFTs', color: 'pink', type: 'distribute' }
        ];

        const container = document.getElementById('moduleList');
        container.innerHTML = `
            <div class="space-y-4">
                <div><p class="text-[9px] text-slate-500 uppercase font-bold mb-2">Actions</p>${renderGroup('action')}</div>
                <div><p class="text-[9px] text-slate-500 uppercase font-bold mb-2">Deploy</p>${renderGroup('deploy')}</div>
                <div><p class="text-[9px] text-slate-500 uppercase font-bold mb-2">Distribution</p>${renderGroup('distribute')}</div>
            </div>
        `;

        function renderGroup(type) {
            return modules.filter(m => m.type === type).map(m => `
                <label class="flex items-center justify-between p-2 bg-slate-800/50 rounded-lg border border-transparent hover:border-${m.color}-500 cursor-pointer mb-1 transition-all">
                    <span class="text-[10px] font-bold uppercase">${m.name}</span>
                    <input type="checkbox" id="${m.id}" checked class="w-3 h-3 accent-${m.color}-500">
                </label>
            `).join('');
        }

        function log(msg, color = "text-slate-400") {
            document.getElementById('log').innerHTML += `<div class="${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        }

        async function connect() {
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            myAddr = await signer.getAddress();
            document.getElementById('connectBtn').innerText = "Connected";
            document.getElementById('connectBtn').disabled = true;
            document.getElementById('walletAddr').innerText = myAddr;
            document.getElementById('netIndicator').classList.replace('bg-slate-600', 'bg-emerald-500');
        }

        async function startMachine() {
            const loops = parseInt(document.getElementById('txCount').value);
            for(let i=0; i<loops; i++) {
                if(document.getElementById('doNative').checked) {
                    const tx = await signer.sendTransaction({to: ethers.Wallet.createRandom().address, value: ethers.parseEther("0.0000000" + Math.floor(Math.random()*9+1))});
                    stats.dust++; log("Dust Sent", "text-blue-400");
                }
                if(document.getElementById('doERC20').checked) {
                    const f = new ethers.ContractFactory([], "0x6080604052348015600f57600080fd5b50603e80601d6000396000f3fe6080604052600080fdfea2646970667358221220", signer);
                    const c = await f.deploy();
                    latestTokenAddress = await c.getAddress();
                    stats.success++; log("Deployed: " + latestTokenAddress, "text-amber-400");
                }
                if(document.getElementById('doTransfer').checked && latestTokenAddress) {
                    log("Distributing...", "text-pink-400");
                    stats.success++;
                }
            }
        }
    </script>
</body>
</html>
