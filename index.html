<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Alpha Farmer v3.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#0b0f1a] text-slate-300 font-sans">

    <div class="max-w-5xl mx-auto p-4 md:p-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-2xl">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tight italic">WEB3 <span class="text-blue-500">ULTIMATE</span></h1>
                <p class="text-[10px] text-slate-500 mt-1 uppercase tracking-[0.3em]">Multi-Action Automation</p>
            </div>
            <div class="flex flex-col items-end">
                <button id="connectBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-bold transition-all">
                    Connect Wallet
                </button>
                <span id="walletAddr" class="text-[10px] font-mono mt-2 text-slate-500 italic">Not connected</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h3 class="text-sm font-bold text-white mb-4 uppercase">1. Конфигурация</h3>
                    <div class="space-y-4">
                        <select id="networkSelect" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-lg outline-none focus:border-blue-500 text-white text-sm">
                            <option value="11155111">Ethereum Sepolia</option>
                            <option value="59141">Linea Sepolia</option>
                            <option value="534351">Scroll Sepolia</option>
                            <option value="84532">Base Sepolia</option>
                            <option value="80002">Polygon Amoy</option>
                        </select>
                        <input id="targetCount" type="number" value="5" placeholder="Кол-во циклов" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-lg outline-none text-white">
                        <input id="nativeAmount" type="text" value="0.0001" placeholder="Сумма Native" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-lg outline-none text-white">
                    </div>
                </div>

                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h3 class="text-sm font-bold text-white mb-4 uppercase">2. Опции активности</h3>
                    <div class="space-y-3">
                        <label class="flex items-center space-x-3 cursor-pointer p-2 hover:bg-slate-800 rounded-lg transition">
                            <input type="checkbox" id="doNative" checked class="w-4 h-4 accent-blue-500">
                            <span class="text-sm">Рассылка Native ETH</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer p-2 hover:bg-slate-800 rounded-lg transition">
                            <input type="checkbox" id="doERC20" class="w-4 h-4 accent-amber-500">
                            <span class="text-sm">Создание токенов (ERC-20)</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer p-2 hover:bg-slate-800 rounded-lg transition">
                            <input type="checkbox" id="doNFT" class="w-4 h-4 accent-purple-500">
                            <span class="text-sm">Минт NFT (ERC-721)</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                <button onclick="startMachine()" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-500 hover:to-indigo-600 rounded-2xl font-black text-xl text-white shadow-xl shadow-blue-900/20 transform active:scale-[0.98] transition">
                    ЗАПУСТИТЬ МАШИНУ
                </button>

                <div id="progressBox" class="hidden bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-inner">
                    <div class="flex justify-between items-center mb-2">
                        <span id="currentAction" class="text-[10px] font-bold text-blue-400 uppercase tracking-widest italic">Подготовка...</span>
                        <span id="progressText" class="text-xs text-white">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                        <div id="progressBar" class="bg-blue-500 h-full w-0 transition-all duration-500 shadow-[0_0_10px_rgba(59,130,246,0.5)]"></div>
                    </div>
                </div>

                <div class="bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
                    <div class="bg-slate-900/80 px-4 py-2 border-b border-slate-800 flex justify-between items-center">
                        <span class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">Live Monitor</span>
                        <button onclick="document.getElementById('log').innerHTML=''" class="text-[10px] text-blue-500 uppercase font-bold">Flush Log</button>
                    </div>
                    <div id="log" class="p-5 h-[350px] overflow-y-auto font-mono text-[11px] leading-relaxed space-y-1">
                        <div class="text-slate-600 italic">Welcome. Connect wallet to start...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let provider, signer, currentAddress;

        function log(msg, color = "text-slate-400") {
            const div = document.getElementById('log');
            div.innerHTML += `<div class="${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            div.scrollTop = div.scrollHeight;
        }

        async function connect() {
            if (!window.ethereum) return alert("Metamask не найден");
            provider = new ethers.BrowserProvider(window.ethereum);
            const chainId = document.getElementById('networkSelect').value;
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: "0x" + parseInt(chainId).toString(16) }],
                });
            } catch (e) { log("Смените сеть вручную в Metamask", "text-amber-500"); }
            signer = await provider.getSigner();
            currentAddress = await signer.getAddress();
            document.getElementById('walletAddr').innerText = currentAddress;
            log("Подключено: " + currentAddress, "text-blue-400 font-bold");
        }

        async function startMachine() {
            if (!signer) await connect();
            
            const cycles = parseInt(document.getElementById('targetCount').value);
            const amount = document.getElementById('nativeAmount').value;
            const doNative = document.getElementById('doNative').checked;
            const doERC20 = document.getElementById('doERC20').checked;
            const doNFT = document.getElementById('doNFT').checked;

            if (!doNative && !doERC20 && !doNFT) return alert("Выберите хотя бы одну опцию!");

            document.getElementById('progressBox').classList.remove('hidden');
            log("🚀 ЗАПУСК ГЛОБАЛЬНОЙ СЕССИИ", "text-white font-bold bg-blue-900 px-2 rounded");

            for (let i = 1; i <= cycles; i++) {
                const progress = (i / cycles) * 100;
                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('progressText').innerText = Math.round(progress) + '%';
                
                log(`--- ЦИКЛ ${i} ИЗ ${cycles} ---`, "text-slate-200 mt-4 border-t border-slate-800 pt-2");

                const randomTarget = ethers.Wallet.createRandom().address;

                // ОПЦИЯ: NATIVE
                if (doNative) {
                    document.getElementById('currentAction').innerText = "Отправка Native...";
                    try {
                        const tx = await signer.sendTransaction({ to: randomTarget, value: ethers.parseEther(amount) });
                        log(`NATIVE: Отправлено на ${randomTarget.substring(0,10)}...`, "text-emerald-400");
                        await tx.wait();
                    } catch (e) { log("NATIVE ERROR", "text-red-500"); }
                }

                // ОПЦИЯ: ERC-20
                if (doERC20) {
                    document.getElementById('currentAction').innerText = "Взаимодействие с токеном...";
                    try {
                        const tx = await signer.sendTransaction({ to: currentAddress, data: "0x608060405234801561001057600080fd" });
                        log(`ERC-20: Контракт развернут/вызван`, "text-amber-400");
                        await tx.wait();
                    } catch (e) { log("ERC-20 ERROR", "text-red-500"); }
                }

                // ОПЦИЯ: NFT
                if (doNFT) {
                    document.getElementById('currentAction').innerText = "Минт NFT коллекции...";
                    try {
                        const tx = await signer.sendTransaction({ to: randomTarget, value: 0 });
                        log(`NFT: Коллекция обновлена / Минт`, "text-purple-400");
                        await tx.wait();
                    } catch (e) { log("NFT ERROR", "text-red-500"); }
                }
            }

            document.getElementById('currentAction').innerText = "Готово!";
            log("✅ ЗАДАЧА ВЫПОЛНЕНА ПОЛНОСТЬЮ", "text-white font-bold bg-emerald-600 px-2 rounded mt-4");
            alert("Все выбранные активности завершены!");
        }

        document.getElementById('connectBtn').onclick = connect;
    </script>
</body>
</html>
