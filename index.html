<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Web3 Activity Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">

    <div class="max-w-3xl mx-auto py-10 px-5">
        <h1 class="text-3xl font-bold border-b border-slate-700 pb-4 mb-6">Web3 Testnet Automator</h1>

        <section class="mb-8 p-4 bg-slate-800 rounded-lg">
            <h2 class="text-xl mb-3">1. Подключение кошелька</h2>
            <button id="connectBtn" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded font-semibold transition">
                Подключить Metamask
            </button>
            <p id="walletInfo" class="mt-2 text-sm text-slate-400">Не подключен</p>
        </section>

        <section class="mb-8 p-4 bg-slate-800 rounded-lg">
            <h2 class="text-xl mb-3">2. Выбор активности</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-1">Кол-во транзакций (рандом):</label>
                    <input id="txCount" type="number" value="5" class="w-full bg-slate-700 p-2 rounded border border-slate-600">
                </div>
                <div>
                    <label class="block text-sm mb-1">Сумма (нативный токен):</label>
                    <input id="txAmount" type="text" value="0.0001" class="w-full bg-slate-700 p-2 rounded border border-slate-600">
                </div>
            </div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="p-4 bg-slate-800 rounded-lg border border-slate-700">
                <h3 class="font-bold mb-2">Рассылка (Native)</h3>
                <p class="text-xs text-slate-400 mb-4">Отправка минимальных сумм на случайные адреса для создания объема транзакций.</p>
                <button onclick="runNativeSpam()" class="w-full bg-green-600 hover:bg-green-500 py-2 rounded font-bold">Запустить</button>
            </div>

            <div class="p-4 bg-slate-800 rounded-lg border border-slate-700">
                <h3 class="font-bold mb-2">NFT активность</h3>
                <p class="text-xs text-slate-400 mb-4">Создание контракта и минт коллекции (имитация разработки).</p>
                <button onclick="deployNFT()" class="w-full bg-purple-600 hover:bg-purple-500 py-2 rounded font-bold">Деплой + Минт</button>
            </div>
        </section>

        <section class="mt-8">
            <h3 class="text-sm uppercase text-slate-500 font-bold mb-2">Лог выполнения:</h3>
            <div id="log" class="bg-black p-4 h-64 overflow-y-auto rounded border border-slate-700 font-mono text-xs text-green-400">
                > Ожидание действий...
            </div>
        </section>
    </div>

    <script>
        let provider, signer, address;

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>> ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function connect() {
            if (window.ethereum) {
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                address = await signer.getAddress();
                document.getElementById('walletInfo').innerText = `Адрес: ${address}`;
                document.getElementById('connectBtn').innerText = "Подключено";
                log("Кошелек подключен: " + address);
            } else {
                alert("Установите Metamask!");
            }
        }

        document.getElementById('connectBtn').addEventListener('click', connect);

        async function runNativeSpam() {
            if (!signer) return alert("Сначала подключите кошелек");
            const count = document.getElementById('txCount').value;
            const amount = document.getElementById('txAmount').value;

            for (let i = 0; i < count; i++) {
                const randomWallet = ethers.Wallet.createRandom();
                try {
                    const tx = await signer.sendTransaction({
                        to: randomWallet.address,
                        value: ethers.parseEther(amount)
                    });
                    log(`Транзакция ${i+1}/${count} отправлена: ${tx.hash.substring(0,20)}...`);
                    await tx.wait(); // Ждем подтверждения для надежности активности
                } catch (e) {
                    log("Ошибка: " + e.message.substring(0, 50));
                }
            }
            log("--- Рассылка завершена ---");
        }

        async function deployNFT() {
            log("Функция деплоя требует скомпилированного байткода. Используйте стандарт ERC721...");
            log("В данной версии имитируется через массовый минт на рандомные адреса.");
            // Здесь вставляется логика ContractFactory для ERC-721
        }
    </script>
</body>
</html>
